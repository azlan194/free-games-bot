name: Run Daily Free Games Check

on:
  schedule:
    - cron: '0 15 * * *' # Runs at 12:00 UTC (Adjust to your local 8:00 AM)
  workflow_dispatch:

# 🔑 GRANT PERMISSIONS TO WRITE BACK TO THE REPOSITORY
permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install requests

    - name: Execute script
      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      run: python main.py

    # 💾 SAVE THE LOG FILE BACK TO GITHUB
    - name: Commit and push history file changes
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add posted_games.txt
        # Only commit if the file actually changed, avoiding errors if nothing is new
        git diff-index --quiet HEAD || git commit -m "Update posted games history [skip ci]"
        git push
